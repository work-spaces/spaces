[package]
name = "spaces-console"
version = "0.1.1"
edition = "2024"

[dependencies]
superconsole = { git = "https://github.com/facebookincubator/superconsole", rev = "e90821759b257ed12cbf645e88fd0cdb896c613f"}
strum = { version = "0.26", features = ["derive"] }
crossterm = { version = "0.29" }
clap = { version = "4", features = ["derive"] }
markdown = "1"
plotters = { version = "0.3.7", default-features = false, features = ["histogram", "line_series", "point_series"] }
plotters-backend = "0.3"
unicode-width = "0.1"

serde.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
anyhow-source-location.workspace = true


[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
