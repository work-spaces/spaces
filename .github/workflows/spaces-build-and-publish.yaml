name: Spaces Build and Publish Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload binaries for (e.g. v1.2.3)"
        required: true
        type: string
      publish-dry-run:
        description: "Run the build without publishing"
        required: false
        type: choice
        options:
          - "ON"
          - "OFF"
      build-linux-x86_64:
        description: "Build and publish Linux x86_64"
        required: false
        type: boolean
        default: true
      build-linux-aarch64:
        description: "Build and publish Linux aarch64"
        required: false
        type: boolean
        default: true
      build-macos-aarch64:
        description: "Build and publish macOS aarch64"
        required: false
        type: boolean
        default: true
      build-macos-x86_64:
        description: "Build and publish macOS x86_64"
        required: false
        type: boolean
        default: true
      build-windows-x86_64:
        description: "Build and publish Windows x86_64"
        required: false
        type: boolean
        default: true


jobs:
  build-linux-x86_64:
    if: ${{ inputs.build-linux-x86_64 }}
    name: Build and Publish Linux x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: work-spaces/spaces-checkout-run@v0.20.9
        with:
          checkout: >-
            --locked
            --url=https://github.com/work-spaces/spaces
            --rev=${{ inputs.tag }}
            --store=SPACES_RELEASE_TAG=${{ inputs.tag }}
            --store=SPACES_PUBLISH_DRY_RUN=${{ inputs.publish-dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run: //spaces:publish_release

  build-linux-aarch64:
    if: ${{ inputs.build-linux-aarch64 }}
    name: Build and Publish Linux aarch64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: work-spaces/spaces-checkout-run@v0.20.9
        with:
          checkout: >-
            --locked
            --url=https://github.com/work-spaces/spaces
            --rev=${{ inputs.tag }}
            --store=SPACES_RELEASE_TAG=${{ inputs.tag }}
            --store=SPACES_PUBLISH_DRY_RUN=${{ inputs.publish-dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run: //spaces:publish_release

  build-macos-aarch64:
    if: ${{ inputs.build-macos-aarch64 }}
    name: Build and Publish macOS aarch64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: work-spaces/spaces-checkout-run@v0.20.9
        with:
          checkout: >-
            --locked
            --url=https://github.com/work-spaces/spaces
            --rev=${{ inputs.tag }}
            --store=SPACES_RELEASE_TAG=${{ inputs.tag }}
            --store=SPACES_PUBLISH_DRY_RUN=${{ inputs.publish-dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run: //spaces:publish_release

  build-macos-x86_64:
    if: ${{ inputs.build-macos-x86_64 }}
    name: Build and Publish macOS x86_64
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: work-spaces/spaces-checkout-run@v0.20.9
        with:
          checkout: >-
            --locked
            --url=https://github.com/work-spaces/spaces
            --rev=${{ inputs.tag }}
            --store=SPACES_RELEASE_TAG=${{ inputs.tag }}
            --store=SPACES_PUBLISH_DRY_RUN=${{ inputs.publish-dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run: //spaces:publish_release

  build-windows-x86_64:
    if: ${{ inputs.build-windows-x86_64 }}
    name: Build and Publish Windows x86_64
    runs-on: windows-2022
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: work-spaces/spaces-checkout-run@v0.20.9
        with:
          checkout: >-
            --locked
            --url=https://github.com/work-spaces/spaces
            --rev=${{ inputs.tag }}
            --store=SPACES_RELEASE_TAG=${{ inputs.tag }}
            --store=SPACES_PUBLISH_DRY_RUN=${{ inputs.publish-dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run: //spaces:publish_release
